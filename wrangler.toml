name = "nyirira"
type = "javascript"
compatibility_date = "2024-12-16"
dir = ".next/server"

[env.production]
name = "nyirira-production"

[env.staging]
name = "nyirira-staging"

[build]
command = "pnpm build"
cwd = "./"
watch_paths = ["app/**/*.{tsx,ts}", "components/**/*.{tsx,ts}", "lib/**/*.{ts}", "public/**/*"]

[build.upload]
format = "modules"

[docs]
theme = "openapi-3"

[[routes]]
pattern = "^/.*"
zone_name = "example.com"

[env.production.routes]
[[env.production.routes]]
pattern = "^/.*"
zone_name = "example.com"

[env.staging.routes]
[[env.staging.routes]]
pattern = "^/.*"
zone_name = "staging.example.com"
